name: deskline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deskline
      POSTGRES_PASSWORD: deskline
      POSTGRES_DB: deskline
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U deskline -d deskline']
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies migrations and loads the demo workspace (skips if present).
  seed:
    build:
      context: .
      target: build
    command: ['npx', 'tsx', 'scripts/seed.ts']
    environment:
      DATABASE_URL: postgres://deskline:deskline@postgres:5432/deskline
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build: .
    environment:
      DATABASE_URL: postgres://deskline:deskline@postgres:5432/deskline
      # Migrations are idempotent and guarded by an advisory lock.
      MIGRATE_ON_START: 'true'
      SLA_WORKER_ENABLED: 'true'
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
