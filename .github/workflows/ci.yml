name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test (PGlite), build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests (PGlite)
        run: npm test
      - name: Build
        run: npm run build

  test-postgres:
    name: Integration tests against PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: deskline
          POSTGRES_PASSWORD: deskline
          POSTGRES_DB: deskline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U deskline -d deskline_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Each test file migrates into its own schema, so concurrency tests
      # (SKIP LOCKED claiming, duplicate webhook deliveries) race for real.
      TEST_DATABASE_URL: postgres://deskline:deskline@localhost:5432/deskline_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E (production build, seeded PGlite)
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: deskline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test against PostgreSQL
        run: |
          docker network create deskline-ci
          docker run -d --name pg --network deskline-ci \
            -e POSTGRES_USER=deskline -e POSTGRES_PASSWORD=deskline -e POSTGRES_DB=deskline \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U deskline -d deskline && break
            sleep 1
          done
          docker run -d --name app --network deskline-ci -p 3000:3000 \
            -e DATABASE_URL=postgres://deskline:deskline@pg:5432/deskline \
            -e MIGRATE_ON_START=true \
            deskline:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/inbox)" = "307"
          docker logs app | tail -n 20
